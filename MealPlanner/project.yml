# XcodeGen project spec
# Run: brew install xcodegen && xcodegen generate
# Then open MealPlanner.xcodeproj in Xcode.

name: MealPlanner
options:
  bundleIdPrefix: com.yourfamily
  deploymentTarget:
    iOS: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.0.0"

targets:
  MealPlanner:
    type: application
    platform: iOS
    sources:
      - path: MealPlanner
    info:
      path: MealPlanner/Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFirestoreSwift
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourfamily.mealplanner
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
